<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td style="padding:40px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;font-family:'Geist Mono',Menlo,Consolas,'Courier New',monospace;color:#000000;">
          <tr>
            <td style="font-size:17px;padding-bottom:56px;">MABusy[ex]Students_life</td>
          </tr>
          <tr>
            <td style="font-size:13px;color:#767676;padding-bottom:16px;">[Login]</td>
          </tr>
          <tr>
            <td style="font-size:24px;line-height:1.3;padding-bottom:32px;">Tap the button to log in to the archive.</td>
          </tr>
          <tr>
            <td style="padding-bottom:44px;">
              <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
                 style="display:inline-block;font-family:'Geist Mono',Menlo,Consolas,'Courier New',monospace;font-size:17px;color:#ffffff;background:#000000;text-decoration:none;border:1px solid #000000;padding:16px 34px;">Log in →</a>
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;color:#767676;padding-bottom:10px;">[Or type this code on the site]</td>
          </tr>
          <tr>
            <td style="font-size:38px;letter-spacing:8px;padding-bottom:48px;">{{ .Token }}</td>
          </tr>
          <tr>
            <td style="border-top:1px solid #000000;padding-top:16px;font-size:13px;line-height:1.6;color:#767676;">
              The button and the code work once and expire after one hour.<br>
              Didn't ask to log in? You can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
